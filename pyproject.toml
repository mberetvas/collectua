[project]
name = "opcua-client"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncua>=1.1.8",
    "pyyaml>=6.0",
    "textual>=0.87.1",
]

[project.scripts]
opcua-client = "opcua_client:main"
opcua-tui = "opcua_client.tui:main"

[build-system]
requires = ["uv_build>=0.9.4,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
